<div class="ghibli-atmosphere">

    @for (p of petals; track $index) {
    <span class="petal"></span>
    }

    @for (m of motes; track $index) {
    <span class="mote"></span>
    }
</div>

<div class="hint-content">
    <div class="icon-container">
        <div class="magic-ripple"></div>
        <mat-icon class="hint-icon">cloud_upload</mat-icon>
    </div>
    <span class="hint-text">
        @if (count(); as n) {
            Release to drop {{ n }} {{ n === 1 ? 'file' : 'files' }} into Zone 1
        } @else {
            Release to drop into Zone 1
        }
    </span>
</div>
